<!doctype html><html lang="zh-CN"><body style="font-family:Arial,'Microsoft YaHei',sans-serif;color:#172033"><div style="max-width:680px;border:1px solid #ddd;border-radius:10px;padding:22px"><h2 style="color:{% if recovery %}#15803d{% else %}#b91c1c{% endif %}">{% if recovery %}故障已恢复{% else %}严重故障告警{% endif %}：{{ incident.name }}</h2><p><strong>系统：</strong>{{ incident.name }}</p><p><strong>故障：</strong>{{ incident.last_error }}</p><p><strong>首次发生：</strong>{{ incident.first_seen_at }}</p><p><strong>连续失败次数：</strong>{{ incident.failure_count }}</p>{% if recovery %}<p><strong>恢复时间：</strong>{{ incident.recovered_at }}</p>{% endif %}<p><strong>建议：</strong>{{ suggestion }}</p></div></body></html>
